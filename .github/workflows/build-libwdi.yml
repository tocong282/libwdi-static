name: build-libwdi

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'libwdi/**'
      - 'msvc/**'
      - '.github/workflows/build-libwdi.yml'
  pull_request:
    paths:
      - 'libwdi/**'
      - 'msvc/**'
      - '.github/workflows/build-libwdi.yml'

jobs:
  build-x64-static:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify required file
        shell: powershell
        run: |
          if (!(Test-Path msvc\config.h)) {
            throw 'Missing msvc/config.h in repository'
          }

      - name: Patch projects for x64-only CI build
        shell: powershell
        run: |
          $base = Join-Path $env:GITHUB_WORKSPACE 'libwdi\.msvc'
          $embed = Join-Path $base 'embedder.vcxproj'
          $static = Join-Path $base 'libwdi_static.vcxproj'

          [xml]$sx = Get-Content $static
          foreach ($ig in $sx.Project.ItemGroup) {
            $remove = @()
            foreach ($pr in $ig.ProjectReference) {
              if ($pr.Include -like '*installer_x86.vcxproj' -or $pr.Include -like '*installer_arm64.vcxproj') {
                $remove += $pr
              }
            }
            foreach ($r in $remove) {
              [void]$ig.RemoveChild($r)
            }
          }
          $sx.Save($static)

      - name: Build embedder Win32
        shell: cmd
        run: |
          msbuild libwdi\.msvc\embedder.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      - name: Generate embedded.h
        shell: cmd
        run: |
          cd libwdi
          embedder embedded.h

      - name: Build installer_x64
        shell: cmd
        run: |
          msbuild libwdi\.msvc\installer_x64.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Build libwdi static x64
        shell: cmd
        run: |
          msbuild libwdi\.msvc\libwdi_static.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Collect artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact\include | Out-Null
          New-Item -ItemType Directory -Force artifact\lib\x64 | Out-Null
          Copy-Item libwdi\libwdi.h artifact\include\libwdi.h
          Copy-Item libwdi\x64\Release\lib\libwdi.lib artifact\lib\x64\libwdi.lib
          if (Test-Path libwdi\x64\Release\helper\installer_x64.exe) {
            Copy-Item libwdi\x64\Release\helper\installer_x64.exe artifact\installer_x64.exe
          }
          if (Test-Path libwdi\embedded.h) {
            Copy-Item libwdi\embedded.h artifact\embedded.h
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libwdi-x64-static
          path: artifact
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
